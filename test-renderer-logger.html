<!DOCTYPE html>
<html>
<head>
    <title>Test Renderer Logger</title>
</head>
<body>
    <h1>Test Console Logging</h1>
    <button onclick="testLogs()">Test All Console Methods</button>
    
    <script>
        // Simulate window.api
        window.api = {
            invoke: async (channel, ...args) => {
                console.log('[MOCK IPC]', channel, args);
                return Promise.resolve();
            }
        };
        
        function testLogs() {
            console.log('Test LOG from renderer');
            console.error('Test ERROR from renderer');
            console.warn('Test WARN from renderer');
            console.info('Test INFO from renderer');
            console.debug('Test DEBUG from renderer');
        }
        
        // Auto test on load
        setTimeout(testLogs, 100);
    </script>
</body>
</html>
