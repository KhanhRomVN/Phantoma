<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Phantoma Mobile — Fake UI</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      :root {
        --ember: #ff6a1f;
        --blue: #4fa8e0;
        --violet: #a078ff;
        --green: #3ddc84;
        --red: #ff4757;
        --amber: #ffb020;
        --neutral: #4a4d57;
        --teal: #32c8be;
        --bg: #0a0a0c;
        --card: #131417;
        --hover: #1b1d22;
        --drop: #202329;
        --border: #26282f;
        --div: #1d1f25;
        --t1: #e8e9ed;
        --t2: #8b8d96;
        --t3: rgba(139, 141, 150, 0.55);
        --sh: 0 12px 32px rgba(0, 0, 0, 0.6);
        --disp: "Space Grotesk", sans-serif;
        --mono: "JetBrains Mono", monospace;
      }
      [data-theme="light"] {
        --bg: #f3f4f7;
        --card: #fff;
        --hover: #eceef3;
        --drop: #e4e6ec;
        --border: #dcdfe6;
        --div: #e8eaef;
        --t1: #16181d;
        --t2: #636772;
        --t3: rgba(99, 103, 114, 0.6);
        --sh: 0 12px 32px rgba(20, 24, 40, 0.18);
        --green: #17a85a;
        --amber: #d98a00;
        --teal: #14a399;
        --blue: #2a86c4;
        --violet: #7a52e0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        font:
          13px "Inter",
          system-ui,
          sans-serif;
        color: var(--t1);
      }
      [data-theme="light"] body {
        background: #c9ccd4;
      }
      button,
      input {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        outline: 0;
      }
      button {
        cursor: pointer;
      }
      /* phone: chỉ giữ tỉ lệ 390:844 */
      #phone {
        height: min(100vh, 844px);
        aspect-ratio: 390/844;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
      }
      .ic {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .ic.s {
        width: 13px;
        height: 13px;
      }
      .hd {
        height: 52px;
        padding: 0 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid var(--div);
        flex-shrink: 0;
      }
      .hd h1 {
        font: 600 17px var(--disp);
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hd small {
        font: 500 11px var(--mono);
        color: var(--t3);
      }
      .ib {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--t2);
      }
      .ib:active,
      .ib.on {
        background: var(--hover);
        color: var(--t1);
      }
      .body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
      }
      .body::-webkit-scrollbar {
        width: 0;
      }
      .nav {
        display: flex;
        border-top: 1px solid var(--div);
        background: var(--bg);
        flex-shrink: 0;
        padding-bottom: 6px;
      }
      .nav button {
        flex: 1;
        padding: 9px 0 5px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        font-size: 10.5px;
        color: var(--t2);
        position: relative;
      }
      .nav button.on {
        color: var(--ember);
      }
      .nav i {
        position: absolute;
        top: 4px;
        left: calc(50% + 6px);
        background: var(--red);
        color: #fff;
        font: 600 9px var(--mono);
        font-style: normal;
        border-radius: 8px;
        padding: 0 4px;
      }
      /* dot */
      .dot {
        position: relative;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--neutral);
        flex-shrink: 0;
      }
      .dot.running {
        background: var(--green);
        animation: core 1.6s ease-in-out infinite;
      }
      .dot.review {
        background: var(--amber);
      }
      .dot.done {
        background: var(--teal);
      }
      .dot.blocked {
        background: var(--red);
      }
      .dot.idle {
        background: transparent;
        border: 1.5px solid var(--t3);
      }
      .dot.running::after,
      .dot.blocked::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: inherit;
        animation: ring 1.8s ease-out infinite;
      }
      @keyframes core {
        50% {
          transform: scale(0.8);
        }
      }
      @keyframes ring {
        from {
          transform: scale(1);
          opacity: 0.6;
        }
        to {
          transform: scale(2.7);
          opacity: 0;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dot,
        .dot::after {
          animation: none !important;
        }
      }
      /* project */
      .pc {
        border-bottom: 1px solid var(--div);
      }
      .pt {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 14px 8px;
      }
      .pi {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--c);
        background: color-mix(in srgb, var(--c) 15%, transparent);
      }
      .pt b {
        font: 600 15px var(--disp);
        flex: 1;
      }
      .cnt {
        font: 500 11px var(--mono);
        color: var(--t3);
      }
      .br {
        margin: 0 12px 10px;
        background: var(--card);
        border: 1px solid var(--div);
        border-radius: 12px;
        padding: 11px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .br.blocked {
        border-color: color-mix(in srgb, var(--red) 40%, transparent);
      }
      .br:active {
        border-color: var(--ember);
      }
      .br .n {
        font: 500 11.5px var(--mono);
        color: var(--t2);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .br .ti {
        font-weight: 600;
        font-size: 13.5px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .ags {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .agc {
        display: flex;
        align-items: center;
        gap: 5px;
        background: var(--hover);
        border: 1px solid var(--border);
        border-radius: 99px;
        padding: 2px 9px 2px 3px;
        font-size: 11px;
        color: var(--t2);
      }
      .aa {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--ac);
        color: #fff;
        font: 700 7px var(--disp);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .aa.run {
        outline: 1.5px solid var(--green);
        outline-offset: 1px;
      }
      .met {
        display: flex;
        gap: 12px;
        font: 400 11px var(--mono);
        color: var(--t3);
      }
      .met b {
        font-weight: 500;
        color: var(--t2);
      }
      .a {
        color: var(--green);
      }
      .r {
        color: var(--red);
      }
      .hint {
        font-size: 12px;
        color: var(--red);
        background: color-mix(in srgb, var(--red) 10%, transparent);
        border-radius: 7px;
        padding: 5px 9px;
      }
      .pp {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font: 500 11px var(--mono);
        color: var(--green);
      }
      /* segmented tabs */
      .seg {
        display: flex;
        gap: 2px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--div);
        flex-shrink: 0;
      }
      .seg button {
        flex: 1;
        height: 32px;
        border-radius: 8px;
        color: var(--t2);
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        font-size: 12px;
      }
      .seg button.on {
        background: var(--hover);
        color: var(--ember);
      }
      /* chat */
      .chat {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .m {
        max-width: 88%;
        padding: 9px 12px;
        border-radius: 14px;
        line-height: 1.5;
        font-size: 13px;
      }
      .m.u {
        align-self: flex-end;
        background: var(--ember);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .m.a {
        align-self: flex-start;
        background: var(--card);
        border: 1px solid var(--div);
        border-bottom-left-radius: 4px;
      }
      .tool {
        align-self: flex-start;
        font: 11.5px var(--mono);
        color: var(--t2);
        background: var(--hover);
        border-radius: 8px;
        padding: 6px 10px;
        display: flex;
        gap: 7px;
        align-items: center;
        max-width: 92%;
      }
      .tool .ok {
        color: var(--green);
      }
      .tool .sp {
        animation: spin 1s linear infinite;
        color: var(--blue);
      }
      .appr {
        align-self: stretch;
        border: 1px solid color-mix(in srgb, var(--amber) 50%, transparent);
        background: color-mix(in srgb, var(--amber) 8%, transparent);
        border-radius: 12px;
        padding: 11px;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .appr code {
        font: 12px var(--mono);
        color: var(--t1);
      }
      .btns {
        display: flex;
        gap: 8px;
      }
      .btn {
        flex: 1;
        height: 34px;
        border-radius: 9px;
        font-weight: 600;
        font-size: 12.5px;
        background: var(--drop);
      }
      .btn.p {
        background: var(--ember);
        color: #fff;
      }
      .bar {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--div);
        align-items: center;
        flex-shrink: 0;
      }
      .bar input {
        flex: 1;
        height: 38px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 19px;
        padding: 0 15px;
      }
      .bar input:focus {
        border-color: var(--ember);
      }
      .send {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: var(--ember);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chips {
        display: flex;
        gap: 6px;
        padding: 0 12px 8px;
        overflow-x: auto;
        flex-shrink: 0;
      }
      .chips::-webkit-scrollbar {
        height: 0;
      }
      .chip {
        white-space: nowrap;
        border: 1px solid var(--border);
        border-radius: 99px;
        padding: 5px 11px;
        font-size: 11.5px;
        color: var(--t2);
      }
      /* terminal */
      .term {
        flex: 1;
        overflow-y: auto;
        background: #07080a;
        color: #d5d8df;
        font: 11.5px/1.6 var(--mono);
        padding: 12px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .term .p {
        color: var(--ember);
      }
      .term .g {
        color: #3ddc84;
      }
      .term .e {
        color: #ff4757;
      }
      .term .d {
        color: #7b7e88;
      }
      .keys {
        display: flex;
        gap: 6px;
        padding: 8px 10px 0;
        background: #07080a;
        overflow-x: auto;
        flex-shrink: 0;
      }
      .keys::-webkit-scrollbar {
        height: 0;
      }
      .keys button {
        font: 500 11px var(--mono);
        background: #1b1d22;
        color: #c9ccd4;
        border-radius: 6px;
        padding: 6px 10px;
        white-space: nowrap;
      }
      .tin {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 12px 10px;
        background: #07080a;
        font: 12.5px var(--mono);
        color: #d5d8df;
        flex-shrink: 0;
      }
      .tin input {
        flex: 1;
      }
      /* files */
      .fl {
        padding: 6px 8px;
      }
      .f {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 10px 8px;
        border-radius: 9px;
        font: 12.5px var(--mono);
      }
      .f:active {
        background: var(--hover);
      }
      .f .fn {
        flex: 1;
      }
      .f .tg {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 5px;
      }
      .tg.M {
        color: var(--amber);
        background: color-mix(in srgb, var(--amber) 15%, transparent);
      }
      .tg.A {
        color: var(--green);
        background: color-mix(in srgb, var(--green) 15%, transparent);
      }
      .code {
        font: 11.5px/1.65 var(--mono);
        padding: 6px 0;
        overflow-x: auto;
      }
      .ln {
        display: flex;
        white-space: pre;
        padding: 0 10px;
      }
      .ln span:first-child {
        width: 30px;
        color: var(--t3);
        flex-shrink: 0;
        user-select: none;
      }
      .ln.add {
        background: color-mix(in srgb, var(--green) 13%, transparent);
      }
      .ln.del {
        background: color-mix(in srgb, var(--red) 13%, transparent);
      }
      .crumb {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 12px;
        font: 12px var(--mono);
        color: var(--t2);
        border-bottom: 1px solid var(--div);
      }
      /* remote screen */
      .mon {
        display: flex;
        gap: 6px;
        padding: 10px 12px 0;
      }
      .mon button {
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        color: var(--t2);
        font-size: 12px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .mon button.on {
        border-color: var(--ember);
        color: var(--ember);
      }
      .scr {
        margin: 10px 12px;
        aspect-ratio: 16/10;
        background: #15171c;
        border: 1px solid var(--border);
        border-radius: 10px;
        position: relative;
        overflow: hidden;
        touch-action: none;
        cursor: crosshair;
      }
      .w {
        position: absolute;
        border-radius: 5px;
        background: #1e2128;
        border: 1px solid #2c3039;
        font: 7px var(--mono);
        color: #8b8d96;
        padding: 14px 5px 4px;
        overflow: hidden;
        line-height: 1.6;
      }
      .w::before {
        content: "";
        position: absolute;
        top: 4px;
        left: 5px;
        width: 14px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(
          90deg,
          #ff5f57 33%,
          #febc2e 33% 66%,
          #28c840 66%
        );
      }
      .rip {
        position: absolute;
        width: 30px;
        height: 30px;
        margin: -15px 0 0 -15px;
        border-radius: 50%;
        border: 2px solid var(--ember);
        animation: rp 0.6s ease-out forwards;
        pointer-events: none;
      }
      @keyframes rp {
        from {
          transform: scale(0.3);
          opacity: 1;
        }
        to {
          transform: scale(1.6);
          opacity: 0;
        }
      }
      .tools {
        display: flex;
        gap: 6px;
        padding: 0 12px;
      }
      .tools button {
        flex: 1;
        height: 44px;
        border-radius: 10px;
        background: var(--card);
        border: 1px solid var(--div);
        color: var(--t2);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-size: 10.5px;
      }
      .tools button.on {
        border-color: var(--ember);
        color: var(--ember);
      }
      .log {
        margin: 10px 12px;
        font: 11px var(--mono);
        color: var(--t3);
      }
      /* inbox/settings */
      .sec {
        padding: 14px 14px 6px;
        font: 600 12px var(--disp);
        color: var(--t2);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 14px;
        border-bottom: 1px solid var(--div);
      }
      .row span {
        flex: 1;
      }
      .row small {
        color: var(--t3);
        font: 11px var(--mono);
      }
      .tgl {
        width: 40px;
        height: 23px;
        border-radius: 12px;
        background: var(--drop);
        position: relative;
        transition: 0.2s;
      }
      .tgl::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 17px;
        height: 17px;
        border-radius: 50%;
        background: #fff;
        transition: 0.2s;
      }
      .tgl.on {
        background: var(--ember);
      }
      .tgl.on::after {
        left: 20px;
      }
      .card {
        margin: 6px 12px;
        background: var(--card);
        border: 1px solid var(--div);
        border-radius: 12px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      #toast {
        position: absolute;
        left: 50%;
        bottom: 74px;
        transform: translate(-50%, 8px);
        background: var(--drop);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 12px;
        opacity: 0;
        transition: 0.2s;
        pointer-events: none;
        box-shadow: var(--sh);
        white-space: nowrap;
        z-index: 9;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    </style>
  </head>
  <body>
    <div id="phone"></div>
    <div id="toast"></div>
    <script>
      /* ═══ MOCK DATA ═══ */
      const AC = { O: "#ff6a1f", X: "#a078ff", C: "#4fa8e0", G: "#3ddc84" };
      const ag = (n, st) => ({
        n,
        c: AC[n[0]] || "#8b8d96",
        ini: n.slice(0, 2),
        st,
      });
      const sm = (tok, cost, add, rem, files, dur) => ({
        tok,
        cost,
        add,
        rem,
        files,
        dur,
      });
      const PROJECTS = [
        {
          id: "p1",
          name: "acme-web",
          color: "#4fa8e0",
          branches: [
            {
              name: "feature/checkout-flow-v2",
              s: {
                id: "s1",
                title: "Dựng lại form địa chỉ giao hàng",
                st: "running",
                t: "8 phút",
                agents: [ag("Orca-1", "working"), ag("Codex-2", "working")],
                procs: 2,
                sum: sm(48, 0.42, 96, 14, 6, "23m"),
              },
            },
            {
              name: "feature/checkout-baseline",
              s: {
                id: "s2",
                title: "Chờ API key sandbox thanh toán",
                st: "blocked",
                t: "20 phút",
                agents: [ag("Claude-4", "blocked")],
                sum: sm(9, 0.15, 4, 0, 1, "7m"),
                hint: "Cần chủ dự án cấp key để agent chạy tiếp",
              },
            },
            {
              name: "main",
              s: {
                id: "s0",
                title: "Nâng cấp deps & sửa lint",
                st: "done",
                t: "1 ngày",
                agents: [ag("Codex-1", "done")],
                procs: 1,
                sum: sm(12, 0.11, 18, 20, 5, "6m"),
              },
            },
            {
              name: "feature/auth-session-refresh",
              s: {
                id: "s3",
                title: "Rà soát phiên đăng nhập",
                st: "queued",
                t: "5 giờ",
                agents: [ag("Orca-3", "queued")],
                sum: sm(0, 0, 0, 0, 0, "—"),
              },
            },
          ],
        },
        {
          id: "p2",
          name: "acme-internal",
          color: "#ffb020",
          branches: [
            {
              name: "feature/agent-handoff-summary",
              s: {
                id: "s5",
                title: "Viết lại tóm tắt bàn giao",
                st: "running",
                t: "12 phút",
                agents: [ag("Orca-1", "working"), ag("Orca-2", "working")],
                procs: 1,
                sum: sm(120, 1.08, 96, 14, 4, "1h12"),
              },
            },
            {
              name: "fix/checks-detail-link",
              s: {
                id: "s6",
                title: "Sửa link “Xem chi tiết” dùng sai run ID",
                st: "review",
                t: "2 giờ",
                agents: [ag("Codex-3", "done")],
                sum: sm(34, 0.3, 6, 1, 2, "22m"),
              },
            },
          ],
        },
        {
          id: "p3",
          name: "phantoma-proxy",
          color: "#a078ff",
          branches: [
            {
              name: "master",
              s: {
                id: "s7",
                title: "HTTPS capture: gộp TLS handshake",
                st: "review",
                t: "3 giờ",
                agents: [ag("Orca-2", "done")],
                sum: sm(58, 0.51, 210, 48, 7, "52m"),
              },
            },
            {
              name: "feature/target-groups",
              s: {
                id: "s8",
                title: "Giao diện target group",
                st: "running",
                t: "1 phút",
                agents: [ag("Codex-2", "working")],
                procs: 2,
                sum: sm(15, 0.13, 33, 2, 3, "9m"),
              },
            },
          ],
        },
      ];
      const LBL = {
        running: "Đang chạy",
        review: "Chờ duyệt",
        blocked: "Bị chặn",
        queued: "Hàng đợi",
        done: "Xong",
        idle: "Nghỉ",
      };
      const CHAT = [
        {
          k: "u",
          t: "Dựng lại form địa chỉ giao hàng: validate số điện thoại VN, tự gợi ý quận/huyện.",
        },
        {
          k: "a",
          t: "Đã rõ. Mình sẽ tách ShippingForm thành 3 phần và thêm validator riêng cho SĐT.",
        },
        { k: "t", s: "ok", t: "read_file  src/components/ShippingForm.tsx" },
        { k: "t", s: "ok", t: "edit_file  src/api/address.ts  +42 −6" },
        {
          k: "a",
          t: "Xong phần validate. Mình chạy test, sau đó cần bạn duyệt một lệnh cài thư viện.",
        },
        { k: "t", s: "run", t: "npm run test:watch  (đang chạy…)" },
        { k: "p", t: "npm i libphonenumber-js@1.11" },
      ];
      const TERM = [
        ["d", "~/acme-web (feature/checkout-flow-v2)"],
        ["p", "$ ", "npm run test:watch"],
        ["d", "> vitest --watch"],
        ["g", " ✓ tests/address.test.ts (12)"],
        ["g", " ✓ tests/phone.test.ts (8)"],
        ["e", " ✗ tests/district.test.ts > gợi ý quận Gò Vấp"],
        ["d", "   expected 3 results, got 0"],
        ["d", " Test Files 1 failed | 2 passed"],
        ["d", " Watching for file changes…"],
      ];
      const FILES = [
        ["src/components/ShippingForm.tsx", "M"],
        ["src/api/address.ts", "A"],
        ["src/lib/phone.ts", "A"],
        ["tests/district.test.ts", "M"],
        ["package.json", "M"],
        ["README.md", ""],
      ];
      const CODE = [
        [" ", 'import { useState } from "react";'],
        ["-", "const phoneRe = /^\\d{10}$/;"],
        ["+", 'import { parsePhone } from "../lib/phone";'],
        [" ", ""],
        [" ", "export function ShippingForm() {"],
        [" ", '  const [phone, setPhone] = useState("");'],
        ["-", "  const ok = phoneRe.test(phone);"],
        ["+", '  const ok = parsePhone(phone, "VN").valid;'],
        ["+", "  const hint = suggestDistrict(city);"],
        [" ", "  return <Form onSubmit={submit} />;"],
        [" ", "}"],
      ];
      const S = {
        tab: "projects",
        sid: null,
        stab: "chat",
        theme: "dark",
        file: null,
        mon: 0,
        mode: "click",
        notif: [1, 1, 0],
        log: "Chạm vào màn hình để click",
        term: null,
        chat: null,
      };
      /* ═══ UI ═══ */
      const P = {
        chev: '<polyline points="9 18 15 12 9 6"/>',
        back: '<polyline points="15 18 9 12 15 6"/>',
        git: '<line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>',
        folder:
          '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
        bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
        gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
        chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
        term: '<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>',
        file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
        mon: '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
        send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
        moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
        ok: '<polyline points="20 6 9 17 4 12"/>',
        sp: '<path d="M21 12a9 9 0 1 1-6.2-8.6"/>',
        cur: '<path d="M5 3l14 8-6 2-2 6z"/>',
        rc: '<path d="M5 3l14 8-6 2-2 6z"/><path d="M17 17l4 4"/>',
        sc: '<polyline points="7 13 12 18 17 13"/><polyline points="7 6 12 11 17 6"/>',
        kb: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/>',
        stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
      };
      const ic = (n, c = "") =>
        `<svg class="ic ${c}" viewBox="0 0 24 24">${P[n]}</svg>`;
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        s.replace(
          /[&<>]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c],
        );
      function toast(m) {
        const t = $("#toast");
        t.textContent = m;
        t.classList.add("on");
        clearTimeout(toast.h);
        toast.h = setTimeout(() => t.classList.remove("on"), 1600);
      }
      const all = () =>
        PROJECTS.flatMap((p) => p.branches.map((b) => ({ p, b, s: b.s })));
      const find = (id) => all().find((x) => x.s.id === id);
      const need = () =>
        all().filter((x) => ["blocked", "review"].includes(x.s.st));
      const agc = (a) =>
        `<span class="agc"><span class="aa ${a.st === "working" ? "run" : ""}" style="--ac:${a.c}">${a.ini}</span>${a.n}</span>`;
      function card({ b, s }) {
        const m = s.sum;
        return `<div class="br ${s.st}" data-go="${s.id}"><div class="n"><span class="dot ${s.st}"></span>${b.name}<span style="margin-left:auto">${LBL[s.st]} · ${s.t}</span></div>
<div class="ti">${s.title}</div><div class="ags">${s.agents.map(agc).join("")}${s.procs ? `<span class="pp">${ic("term", "s")}${s.procs}</span>` : ""}</div>${s.hint ? `<div class="hint">${s.hint}</div>` : ""}
<div class="met"><span><b>${m.tok}k</b> token</span><span>$<b>${m.cost.toFixed(2)}</b></span><span><b>${m.files}</b> file <span class="a">+${m.add}</span> <span class="r">−${m.rem}</span></span></div></div>`;
      }
      function projects() {
        return `<div class="hd"><h1>Dự án</h1><small>MacBook Pro · online</small></div><div class="body">${PROJECTS.map((p) => `<div class="pc"><div class="pt"><span class="pi" style="--c:${p.color}">${ic("git")}</span><b>${p.name}</b><span class="cnt">${p.branches.length} nhánh</span></div>${p.branches.map((b) => card({ b, s: b.s })).join("")}</div>`).join("")}</div>`;
      }
      function inbox() {
        const l = need();
        return `<div class="hd"><h1>Cần xử lý</h1></div><div class="body">${
          l.length
            ? l
                .map(
                  ({
                    p,
                    b,
                    s,
                  }) => `<div class="card"><div class="n" style="font:11.5px var(--mono);color:var(--t2)">${p.name} / ${b.name}</div><div class="ti" style="font-weight:600">${s.title}</div>${s.hint ? `<div class="hint">${s.hint}</div>` : `<div style="color:var(--t2);font-size:12px">${s.sum.files} file thay đổi, <span class="a">+${s.sum.add}</span> <span class="r">−${s.sum.rem}</span></div>`}
<div class="btns"><button class="btn" data-go="${s.id}">Xem phiên</button><button class="btn p" data-act="${s.st === "blocked" ? "Đã gửi API key cho agent" : "Đã duyệt thay đổi"}|${s.id}">${s.st === "blocked" ? "Gửi key" : "Duyệt"}</button></div></div>`,
                )
                .join("")
            : '<div style="margin:auto;color:var(--t3)">Không có gì cần xử lý</div>'
        }</div>`;
      }
      function settings() {
        const tg = (i, l) =>
          `<div class="row"><span>${l}</span><div class="tgl ${S.notif[i] ? "on" : ""}" data-nt="${i}"></div></div>`;
        return `<div class="hd"><h1>Cài đặt</h1></div><div class="body"><div class="sec">Giao diện</div>
<div class="seg"><button class="${S.theme === "dark" ? "on" : ""}" data-th="dark">${ic("moon", "s")}Tối</button><button class="${S.theme === "light" ? "on" : ""}" data-th="light">${ic("sun", "s")}Sáng</button></div>
<div class="sec">Thiết bị</div><div class="row"><span>MacBook Pro của Phong</span><small>2 màn hình · 18ms</small></div><div class="row"><span>PC xưởng</span><small>offline</small></div>
<div class="sec">Thông báo</div>${tg(0, "Agent cần duyệt lệnh")}${tg(1, "Agent bị chặn / lỗi")}${tg(2, "Agent chạy xong")}</div>`;
      }
      function nav() {
        const n = need().length,
          t = (k, i, l) =>
            `<button class="${S.tab === k ? "on" : ""}" data-tab="${k}">${ic(i)}${l}${k === "inbox" && n ? `<i>${n}</i>` : ""}</button>`;
        return `<div class="nav">${t("projects", "folder", "Dự án")}${t("inbox", "bell", "Cần xử lý")}${t("settings", "gear", "Cài đặt")}</div>`;
      }
      /* session view */
      function chatV(s) {
        const c = S.chat[s.id] || (S.chat[s.id] = CHAT.map((x) => ({ ...x })));
        return `<div class="chat" id="sc">${c.map((m, i) => (m.k === "u" || m.k === "a" ? `<div class="m ${m.k}">${esc(m.t)}</div>` : m.k === "t" ? `<div class="tool"><span class="${m.s === "ok" ? "ok" : "sp"}">${ic(m.s === "ok" ? "ok" : "sp", "s")}</span>${esc(m.t)}</div>` : `<div class="appr"><span style="font-size:12px;color:var(--amber);font-weight:600">Agent xin chạy lệnh</span><code>${esc(m.t)}</code><div class="btns"><button class="btn" data-ap="${i}|0">Từ chối</button><button class="btn p" data-ap="${i}|1">Cho phép</button></div></div>`)).join("")}</div>
<div class="chips">${["Chạy lại test", "Tóm tắt thay đổi", "Dừng và hỏi lại", "Commit & push"].map((x) => `<button class="chip" data-q="${x}">${x}</button>`).join("")}</div>
<div class="bar"><input id="inp" placeholder="Nhắn cho agent…" autocomplete="off"><button class="send" data-send>${ic("send")}</button></div>`;
      }
      function termV(s) {
        const t = S.term || (S.term = TERM.map((x) => [...x]));
        return `<div class="term" id="tm">${t.map((l) => (l[0] === "p" ? `<span class="p">${l[1]}</span>${esc(l[2])}` : `<span class="${l[0]}">${esc(l[1])}</span>`)).join("\n")}</div>
<div class="keys">${["Ctrl+C", "Tab", "↑", "↓", "Esc", "clear"].map((k) => `<button data-key="${k}">${k}</button>`).join("")}</div><div class="tin"><span style="color:var(--ember)">$</span><input id="tin" placeholder="nhập lệnh…" autocomplete="off" autocapitalize="off"></div>`;
      }
      function filesV() {
        if (S.file === null)
          return `<div class="body"><div class="crumb">${ic("git", "s")}feature/checkout-flow-v2</div><div class="fl">${FILES.map((f, i) => `<div class="f" data-f="${i}">${ic("file", "s")}<span class="fn">${f[0]}</span>${f[1] ? `<span class="tg ${f[1]}">${f[1]}</span>` : ""}</div>`).join("")}</div></div>`;
        let n = 0;
        return `<div class="crumb"><button data-f="-1" style="display:flex">${ic("back", "s")}</button>${FILES[S.file][0]}</div><div class="body"><div class="code">${CODE.map(
          ([k, t]) => {
            if (k !== "-") n++;
            return `<div class="ln ${k === "+" ? "add" : k === "-" ? "del" : ""}"><span>${k === "-" ? "" : n}</span><span>${k === " " ? " " : k} ${esc(t)}</span></div>`;
          },
        ).join("")}</div></div>`;
      }
      function screenV() {
        const w =
          S.mon === 0
            ? `<div class="w" style="left:3%;top:5%;width:58%;height:88%">const ok = parsePhone(phone,"VN")<br>.valid;<br>return &lt;Form onSubmit/&gt;<br>// ShippingForm.tsx</div><div class="w" style="left:63%;top:5%;width:34%;height:55%;background:#07080a">$ npm run test<br>✓ 12 passed<br>✗ 1 failed</div>`
            : `<div class="w" style="left:4%;top:6%;width:92%;height:86%;background:#fff;color:#333"><b>localhost:3000/checkout</b><br><br>Địa chỉ giao hàng<br>[ Họ tên          ]<br>[ Số điện thoại   ]<br>[ Quận / Huyện  ▾ ]</div>`;
        const tl = (k, i, l) =>
          `<button class="${S.mode === k ? "on" : ""}" data-md="${k}">${ic(i)}${l}</button>`;
        return `<div class="body"><div class="mon">${["Màn 1 · Editor", "Màn 2 · Trình duyệt"].map((l, i) => `<button class="${S.mon === i ? "on" : ""}" data-mon="${i}">${ic("mon", "s")}${l}</button>`).join("")}</div><div class="scr" id="scr">${w}</div>
<div class="tools">${tl("click", "cur", "Click")}${tl("right", "rc", "Chuột phải")}${tl("scroll", "sc", "Cuộn")}<button data-kb>${ic("kb")}Bàn phím</button></div><div class="log" id="lg">${S.log}</div></div>`;
      }
      function session() {
        const x = find(S.sid),
          s = x.s,
          T = [
            ["chat", "chat", "Chat"],
            ["term", "term", "Terminal"],
            ["files", "file", "File"],
            ["scr", "mon", "Màn hình"],
          ];
        const v =
          S.stab === "chat"
            ? chatV(s)
            : S.stab === "term"
              ? termV(s)
              : S.stab === "files"
                ? filesV()
                : screenV();
        return `<div class="hd"><button class="ib" data-back>${ic("back")}</button><h1>${x.b.name}</h1><span class="dot ${s.st}"></span><button class="ib" data-act="Đã gửi lệnh dừng agent|${s.id}">${ic("stop")}</button></div>
<div class="seg">${T.map((t) => `<button class="${S.stab === t[0] ? "on" : ""}" data-st="${t[0]}">${ic(t[1], "s")}${t[2]}</button>`).join("")}</div>${v}`;
      }
      function render() {
        document.documentElement.dataset.theme = S.theme;
        $("#phone").innerHTML = S.sid
          ? session()
          : (S.tab === "projects"
              ? projects()
              : S.tab === "inbox"
                ? inbox()
                : settings()) + nav();
        const c = $("#sc");
        if (c) c.scrollTop = c.scrollHeight;
        const t = $("#tm");
        if (t) t.scrollTop = t.scrollHeight;
      }
      /* ═══ EVENTS ═══ */
      function say() {
        const c = S.chat[S.sid];
        c.push({ k: "t", s: "run", t: "đang suy nghĩ…" });
        render();
        setTimeout(() => {
          c.pop();
          c.push({
            k: "a",
            t: "Đã nhận. Mình bắt tay làm ngay và sẽ báo lại khi xong.",
          });
          render();
        }, 1100);
      }
      function send(txt) {
        if (!txt.trim()) return;
        S.chat[S.sid].push({ k: "u", t: txt });
        say();
      }
      document.addEventListener("click", (e) => {
        const t = e.target,
          g = (s) => t.closest(s);
        let el;
        if ((el = g("[data-go]"))) {
          S.sid = el.dataset.go;
          S.stab = "chat";
          S.file = null;
          return render();
        }
        if (g("[data-back]")) {
          S.sid = null;
          return render();
        }
        if ((el = g("[data-tab]"))) {
          S.tab = el.dataset.tab;
          return render();
        }
        if ((el = g("[data-th]"))) {
          S.theme = el.dataset.th;
          return render();
        }
        if ((el = g("[data-nt]"))) {
          S.notif[el.dataset.nt] ^= 1;
          return render();
        }
        if ((el = g("[data-st]"))) {
          S.stab = el.dataset.st;
          return render();
        }
        if ((el = g("[data-act]"))) {
          const [m, id] = el.dataset.act.split("|");
          const s = find(id).s;
          if (m.startsWith("Đã gửi API") || m.startsWith("Đã duyệt")) {
            s.st = m.startsWith("Đã duyệt") ? "done" : "running";
            s.hint = null;
            s.agents.forEach(
              (a) => (a.st = s.st === "running" ? "working" : "done"),
            );
          }
          if (m.includes("dừng")) s.st = "idle";
          toast(m);
          return render();
        }
        if ((el = g("[data-ap]"))) {
          const [i, ok] = el.dataset.ap.split("|"),
            c = S.chat[S.sid];
          c.splice(
            +i,
            1,
            +ok
              ? { k: "t", s: "ok", t: "npm i libphonenumber-js@1.11" }
              : { k: "a", t: "Đã từ chối lệnh cài đặt." },
          );
          toast(+ok ? "Đã cho phép" : "Đã từ chối");
          return render();
        }
        if ((el = g("[data-q]"))) return send(el.dataset.q);
        if (g("[data-send]")) {
          const i = $("#inp");
          return send(i.value);
        }
        if ((el = g("[data-f]"))) {
          const i = +el.dataset.f;
          S.file = i < 0 ? null : i;
          return render();
        }
        if ((el = g("[data-mon]"))) {
          S.mon = +el.dataset.mon;
          return render();
        }
        if ((el = g("[data-md]"))) {
          S.mode = el.dataset.md;
          return render();
        }
        if (g("[data-kb]")) return toast("Mở bàn phím điều khiển máy tính");
        if ((el = g("[data-key]"))) {
          const k = el.dataset.key;
          if (k === "clear") S.term = [];
          else if (k === "Ctrl+C") S.term.push(["e", "^C"]);
          else toast("Gửi phím " + k);
          return render();
        }
        if (g("#scr")) {
          const r = $("#scr").getBoundingClientRect(),
            x = e.clientX - r.left,
            y = e.clientY - r.top,
            d = document.createElement("div");
          d.className = "rip";
          d.style.cssText = `left:${x}px;top:${y}px`;
          $("#scr").appendChild(d);
          const m = { click: "Click", right: "Chuột phải", scroll: "Cuộn" }[
            S.mode
          ];
          $("#lg").textContent =
            `${m} @ (${Math.round((x / r.width) * 2560)}, ${Math.round((y / r.height) * 1600)}) · màn ${S.mon + 1}`;
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key !== "Enter") return;
        const i = e.target;
        if (i.id === "inp") {
          send(i.value);
        }
        if (i.id === "tin" && i.value.trim()) {
          S.term.push(
            ["p", "$ ", i.value],
            ["d", "(mock) đã gửi tới terminal của MacBook Pro"],
          );
          render();
          $("#tin").focus();
        }
      });
      render();
    </script>
  </body>
</html>
