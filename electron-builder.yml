appId: com.khanhromvn.phantoma
productName: Phantoma
directories:
  buildResources: build
  output: release/v${version}
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,yarn.lock}'
  - '!{tsconfig.json,tsconfig.*.json}'
  - '!{.github,docs,tests,scripts}'
asarUnpack:
  - resources/**
  - '**/*.node'
  - '**/node_modules/@vscode/ripgrep*/**'
extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*.wasm'
  # express-server (runtime backend) — chạy như process riêng
  - from: express-server/dist
    to: express-server/dist
  - from: express-server/package.json
    to: express-server/package.json
  - from: express-server/node_modules
    to: express-server/node_modules
    filter:
      - '**/*'

# Windows Configuration
# artifactName ở cấp win áp dụng cho target zip (portable); nsis có artifactName riêng bên dưới
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: ${productName}-v${version}-win-${arch}.${ext}
  executableName: Phantoma
  icon: build/icon.png

# Windows NSIS Installer (.exe)
nsis:
  artifactName: ${productName}-v${version}-win-${arch}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
        - universal
    - target: zip
      arch:
        - x64
        - arm64
        - universal
  artifactName: ${productName}-v${version}-mac-${arch}.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  icon: build/icon.png

# macOS DMG
dmg:
  artifactName: ${productName}-v${version}-mac-${arch}.${ext}
  title: ${productName} ${version}

# Linux Configuration
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
  maintainer: KhanhRomVN
  category: Utility
  executableName: phantoma
  icon: build/icon.png

# Linux Debian Package
deb:
  artifactName: ${productName}-v${version}-linux-${arch}.${ext}

# Linux Flatpak
flatpak:
  artifactName: ${name}-${version}-${arch}.${ext}

# Linux RPM
rpm:
  artifactName: ${productName}-v${version}-linux-${arch}.${ext}

# Linux AppImage
appImage:
  artifactName: ${productName}-v${version}-linux-${arch}.${ext}

npmRebuild: false
publish:
  provider: github
  owner: KhanhRomVN
  repo: Phantoma
  releaseType: release
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/