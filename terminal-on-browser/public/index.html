<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Terminal on Browser</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="terminal"></div>

  <button id="toggle-panel" title="Hiện/ẩn panel HTTPS">HTTPS</button>

  <aside id="panel" class="panel">
    <header class="panel-header">
      <div class="panel-title">HTTPS Requests</div>
      <div class="panel-actions">
        <button id="clear-list" title="Xóa danh sách">🗑</button>
        <button id="close-panel" title="Đóng">×</button>
      </div>
    </header>
    <div class="panel-status" id="panel-status">Đang kết nối kênh log...</div>
    <div class="panel-list" id="panel-list"></div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
